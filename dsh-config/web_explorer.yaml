# Web Explorer Agent Configuration
name: "Web Explorer"
description: "Recherche et collecte de documentation technique via web_fetch_and_extract"
system_prompt: |
  Tu es l'Explorateur Web de l'équipe. Ton rôle est de :
  1. Rechercher des informations techniques sur internet
  2. Collecter des données en utilisant `web_fetch_and_extract`
  3. Fournir les informations brutes pour analyse
  4. Respecter les limites de sécurité et de qualité des données

agent_config:
  model: "qwen3-coder-30b"
  context_length: 131072
  max_tokens: 4096

# Tools available to this agent
tools:
  - name: "web_fetch_and_extract"
    description: "Télécharge et extrait le contenu d'une page web"
    parameters:
      url:
        type: "string"
        description: "URL de la page web à télécharger"
      css_selector:
        type: "string"
        description: "Sélecteur CSS pour extraire du contenu spécifique"

# Task execution settings
task_execution:
  # Timeout for web requests
  request_timeout_seconds: 15
  
  # Maximum content length to extract (30KB)
  max_content_length: 30000