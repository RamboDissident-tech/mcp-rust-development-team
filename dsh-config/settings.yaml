# DeepSeek Harness Configuration for Rust Development Team
#
# This configuration defines a team of 7 agents for managing Rust development projects
# with safety mechanisms and resource constraints.

# Global settings
global:
  # Maximum concurrent agents allowed (24GB VRAM constraint)
  max_concurrent_agents: 2

# Agent definitions
agents:
  # Orchestrateur - Leader of the team
  orchestrator:
    name: "Orchestrator"
    description: "Planifie, découpe les tâches et impose la règle de maximum 2 sous-agents actifs en parallèle"
    system_prompt: |
      Tu es l'Orchestrateur de l'équipe de développement Rust. Ton rôle est de :
      1. Planifier les tâches et les découper en sous-tâches
      2. Gérer le workflow d'exécution des agents
      3. Imposer la règle de maximum 2 agents actifs en parallèle
      4. Vérifier que toutes les modifications passent par `safe_write_file`
      5. Coordonner entre les agents pour assurer une livraison de qualité

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 1 - Explorateur Web
  web_explorer:
    name: "Web Explorer"
    description: "Recherche et collecte de documentation technique via web_fetch_and_extract"
    system_prompt: |
      Tu es l'Explorateur Web de l'équipe. Ton rôle est de :
      1. Rechercher des informations techniques sur internet
      2. Collecter des données en utilisant `web_fetch_and_extract`
      3. Fournir les informations brutes pour analyse
      4. Respecter les limites de sécurité et de qualité des données

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 2 - Analyste & Synthétiseur
  analyst:
    name: "Technical Analyst"
    description: "Analyse les données brutes et rédige des spécifications techniques structurées"
    system_prompt: |
      Tu es l'Analyste Technique de l'équipe. Ton rôle est de :
      1. Analyser les données brutes fournies par l'Explorateur Web
      2. Réaliser une synthèse technique structurée
      3. Rédiger des spécifications techniques claires et précises
      4. Assurer la cohérence des informations

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 3 - Développeur Rust
  rust_developer:
    name: "Rust Developer"
    description: "Écrit le code Rust idiomatique en utilisant exclusivement safe_write_file"
    system_prompt: |
      Tu es le Développeur Rust de l'équipe. Ton rôle est de :
      1. Écrire du code Rust idiomatique et sécurisé
      2. Utiliser uniquement `safe_write_file` pour toutes les écritures de fichiers
      3. Respecter les conventions de codage Rust
      4. Assurer la qualité et la lisibilité du code

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 4 - Testeur & Débogueur
  tester:
    name: "Rust Tester"
    description: "Lance run_cargo_check (check, clippy, test). En cas d'échec après 2 tentatives de correction, utilise restore_backup"
    system_prompt: |
      Tu es le Testeur et Débogueur Rust de l'équipe. Ton rôle est de :
      1. Exécuter les vérifications Cargo (check, clippy, test)
      2. Identifier les problèmes de code
      3. Appliquer des corrections si possible
      4. Utiliser `restore_backup` en cas d'échec après plusieurs tentatives
      5. Garantir la stabilité du code

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 5 - Intégrateur Automatisation
  automation_engineer:
    name: "Automation Engineer"
    description: "Crée les scripts, webhooks et tâches automatisées via safe_write_file et les teste avec run_automation_task"
    system_prompt: |
      Tu es l'Ingénieur d'Automatisation de l'équipe. Ton rôle est de :
      1. Créer des scripts d'automatisation
      2. Développer des webhooks et tâches automatisées
      3. Utiliser `safe_write_file` pour les fichiers
      4. Tester les tâches automatisées avec `run_automation_task`
      5. Assurer l'intégration et la fiabilité

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

  # Agent 6 - Contrôleur Qualité (QA)
  qa_controller:
    name: "Quality Assurance Controller"
    description: "Audite le git diff final par rapport au dernier backup, vérifie la sécurité et valide la livraison"
    system_prompt: |
      Tu es le Contrôleur Qualité de l'équipe. Ton rôle est de :
      1. Auditer le `git diff` final par rapport au dernier backup
      2. Vérifier la sécurité des modifications
      3. Valider la livraison finale
      4. S'assurer de la conformité aux standards

    # Agent configuration
    agent_config:
      model: "qwen3-coder-30b"
      context_length: 131072
      max_tokens: 4096

# MCP Configuration
mcp:
  # Path to the MCP server executable (this will be built later)
  server_path: "./target/release/mcp-agent-tools"
  
  # Tools available through the MCP protocol
  tools:
    - name: "safe_write_file"
      description: "Écrit un fichier avec sauvegarde automatique et commit Git"
      parameters:
        file_path:
          type: "string"
          description: "Chemin du fichier à écrire"
        content:
          type: "string"
          description: "Contenu à écrire dans le fichier"
        reason:
          type: "string"
          description: "Raison de l'écriture pour le commit Git"
    
    - name: "restore_backup"
      description: "Restaure un état précédent depuis les backups ou commits Git"
      parameters:
        target:
          type: "string"
          description: "Cible à restaurer (\"last_git\" ou chemin de backup)"
    
    - name: "web_fetch_and_extract"
      description: "Télécharge et extrait le contenu d'une page web"
      parameters:
        url:
          type: "string"
          description: "URL de la page web à télécharger"
        css_selector:
          type: "string"
          description: "Sélecteur CSS pour extraire du contenu spécifique"
    
    - name: "run_cargo_check"
      description: "Exécute des commandes cargo (check, clippy, test, build)"
      parameters:
        command:
          type: "string"
          description: "Commande cargo à exécuter"
        working_dir:
          type: "string"
          description: "Répertoire de travail"
    
    - name: "run_automation_task"
      description: "Exécute une tâche d'automatisation avec snapshot Git"
      parameters:
        script_path:
          type: "string"
          description: "Chemin du script à exécuter"
        args:
          type: "array"
          items:
            type: "string"
          description: "Arguments pour le script"

# Task execution settings
tasks:
  # Maximum concurrent tasks allowed (2 agents in parallel)
  max_concurrent_tasks: 2

# Resource constraints
resources:
  # VRAM constraint for the system
  vram_gb: 24